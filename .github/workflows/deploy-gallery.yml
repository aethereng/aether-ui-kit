# Builds and publishes the component gallery to GitHub Pages on every push to main.
#
# The gallery is also the kit's own proof of the token contract (see README) — it's a
# real host app, not a mock, so a broken build here means the kit itself is broken.
# `npm run build` therefore runs the same type-check + vitest-covered build a consumer
# would run, not a gallery-only shortcut.
#
# One-time setup this workflow depends on: Settings → Pages → Source = "GitHub Actions".
# Until that's set, this runs and produces an artifact but nothing is served.
name: Deploy gallery to Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy in flight; a push mid-deploy cancels the older run rather than racing it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # This repo is public. The internal names were scrubbed by hand before v0.2.0 and the
      # scrub still holds, but nothing enforced it -- one careless comment is all it takes.
      # Runs before install so it fails in seconds rather than after a full build.
      #
      # The pattern is deliberately narrow: it must NOT match this project's own identity
      # ("@aether/ui-kit", "aethereng/aether-ui-kit", "aethereng.github.io", "Aether
      # Engineering"), all of which were checked against it. Widen it only after checking the
      # same way -- a guard that cries wolf gets deleted.
      # --exclude is this file: it carries the pattern, so scanning .github would match itself
      # and fail every run. Everything else under .github stays in scope, so a name added to a
      # future workflow is still caught.
      - name: Guard — no internal names in the published surface
        run: |
          if grep -rniE 'quintus|etere|aetheros|aether-os|deskos|desk-os' \
               src package.json README.md .github --exclude=deploy-gallery.yml; then
            echo "::error::Internal name found in the published surface — see the matches above."
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          # Keep in step with .nvmrc. Do NOT lower this: jsdom 30 requires
          # ^22.22.2 || ^24.15.0 || >=26.0.0 and undici 8 requires >=22.19.0, so on Node 20
          # `npm ci` only WARNS (EBADENGINE) and then the suite dies at runtime inside
          # undici with "webidl.util.markAsUncloneable is not a function" -- an error that
          # names neither Node nor jsdom and reads like a broken test.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm run test:unit -- --run

      - name: Build gallery
        # `build` runs type-check and the gallery build in parallel (package.json) —
        # a broken .vue prop type fails this step, same as it would for a consumer.
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
