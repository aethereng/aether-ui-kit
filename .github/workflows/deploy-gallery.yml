# Builds and publishes the component gallery to GitHub Pages when a version tag is pushed.
# Also runnable by hand: Actions tab -> "Run workflow", or `gh workflow run deploy-gallery.yml`.
#
# Tag-triggered rather than push-triggered: what is served should be a version a consumer can
# actually install, not whatever landed on main ten minutes ago. Between tags the site lags main,
# and the local gate stands in for CI meanwhile -- the same three commands this workflow runs:
#
#     npm run guard:names && npm run types:check && npm run test:unit -- --run
#
# The gate runs on the tag too, so a release cannot be published without passing it -- but it runs
# AFTER the tag exists, so a red run means a bad tag is already public. The fix is the next patch
# version, never a moved tag (see README).
#
# The gallery is also the kit's own proof of the token contract (see README) — it's a
# real host app, not a mock, so a broken build here means the kit itself is broken.
# `npm run build` therefore runs the same type-check + vitest-covered build a consumer
# would run, not a gallery-only shortcut.
#
# One-time setup this workflow depends on: Settings → Pages → Source = "GitHub Actions".
# Until that's set, this runs and produces an artifact but nothing is served.
name: Deploy gallery to Pages

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy in flight; a second run started mid-deploy cancels the older one rather than
# racing it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # This repo is public, and nothing enforced the internal-name scrub until this existed.
      # One implementation, in scripts/guard-names.mjs, so it is runnable locally as
      # `npm run guard:names` BEFORE pushing. It was inline shell here and nowhere else, which is
      # exactly how it failed: an internal name entered a CSS comment in v0.4.1 and CI stayed red
      # across four tagged releases, because the local gate sequence never ran it.
      #
      # The script asserts its own pattern does not match this project's identity ("@aether/ui-kit",
      # "aethereng/aether-ui-kit", "aethereng.github.io", "Aether Engineering") and exits 2 if it
      # does -- so widening the pattern cannot silently start failing on a clean tree.
      #
      # Plain node with no deps, so it stays ahead of npm ci and fails in seconds.
      - name: Guard — no internal names in the published surface
        run: node scripts/guard-names.mjs

      - uses: actions/setup-node@v5
        with:
          # Keep in step with .nvmrc. Do NOT lower this: jsdom 30 requires
          # ^22.22.2 || ^24.15.0 || >=26.0.0 and undici 8 requires >=22.19.0, so on Node 20
          # `npm ci` only WARNS (EBADENGINE) and then the suite dies at runtime inside
          # undici with "webidl.util.markAsUncloneable is not a function" -- an error that
          # names neither Node nor jsdom and reads like a broken test.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The .d.ts files under src/ are GENERATED and COMMITTED — consumers install straight from
      # a git tag, so there is no publish step that could build them. Committed artifacts drift,
      # and a stale declaration is worse than none: it type-checks green against a contract the
      # component no longer has. This regenerates them and fails if the result differs from what
      # is committed, which is the whole reason committing them is safe.
      - name: Declarations are in step with the sources
        run: npm run types:check

      - name: Unit tests
        run: npm run test:unit -- --run

      - name: Build gallery
        # `build` runs type-check and the gallery build in parallel (package.json) —
        # a broken .vue prop type fails this step, same as it would for a consumer.
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
